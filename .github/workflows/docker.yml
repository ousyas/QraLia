name: QraLia CI

on:
  push:
    branches: [main, oussama]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api,invoice,generation]" "langchain-core>=1.2,<2"

      - name: Run deterministic Python tests
        run: python -m pytest -q --junitxml=test-results/pytest.xml

      - name: Publish Python test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results
          path: test-results/pytest.xml
          if-no-files-found: ignore

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build React frontend
        working-directory: frontend
        run: npm run build

  container-smoke:
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    env:
      QRALIA_AI_ENABLED: "false"
      QRALIA_HF_LOCAL_FILES_ONLY: "true"
      QRALIA_API_IMAGE: qralia-api:ci
      QRALIA_WEB_IMAGE: qralia-web:ci
      QRALIA_ONEE_CHUNKS_HOST_PATH: ./tests/fixtures/onee_chunks.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          load: true
          tags: qralia-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and load web image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: qralia-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Set up Python for the synthetic fixture
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Create a fully synthetic invoice
        run: |
          python -m pip install "reportlab>=4,<5"
          python scripts/create_synthetic_residential_invoice.py

      - name: Start the complete container stack
        run: docker compose up --detach --no-build --wait --wait-timeout 180

      - name: Exercise health, readiness, OCR and deletion through Nginx
        run: >-
          python scripts/docker_smoke_test.py
          output/pdf/qralia_facture_onee_residentielle_synthetique.pdf
          --base-url http://127.0.0.1:8080/api

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop the container stack
        if: always()
        run: docker compose down --volumes --remove-orphans
